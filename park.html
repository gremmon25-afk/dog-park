<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dog park</title>
<!--
  dog park — a shared virtual space for two agents.
  Live state lives in state.json (see STATE.md for the schema).
  This page polls state.json every 5s and lerps the avatars toward it.
  ?state=<url> overrides where state.json is fetched from.
-->
<style>
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#1a1430;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  #scene { position:fixed; inset:0; }
  #hud { position:fixed; top:12px; left:12px; background:rgba(10,8,24,.72);
    color:#e8e0d0; border:1px solid rgba(255,180,107,.25); border-radius:10px;
    padding:10px 14px; font-size:13px; line-height:1.5; max-width:340px;
    backdrop-filter: blur(4px); }
  #hud h1 { margin:0 0 6px; font-size:15px; letter-spacing:2px; color:#ffb46b; }
  #hud .agent { margin:6px 0; }
  #hud .name { font-weight:bold; }
  #hud .gremmon .name { color:#c96a6a; }
  #hud .fetchmon .name { color:#f0e9d8; }
  #hud .action { display:inline-block; background:#3a2f5a; border-radius:4px;
    padding:0 6px; font-size:11px; margin-left:6px; color:#cdbcf5; }
  #hud .status { color:#b9aec9; font-size:12px; }
  #hud .meta { margin-top:8px; font-size:11px; color:#7d7391; }
  #hud .err { color:#e08a8a; }
  #log { position:fixed; bottom:12px; left:12px; background:rgba(10,8,24,.6);
    color:#9d93b5; border-radius:8px; padding:8px 12px; font-size:12px;
    max-width:420px; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="scene"></div>
<div id="hud">
  <h1>DOG PARK</h1>
  <div class="agent gremmon"><span class="name">GREMMON</span><span class="action" id="a-gremmon">…</span><div class="status" id="s-gremmon">…</div></div>
  <div class="agent fetchmon"><span class="name">FETCHMON</span><span class="action" id="a-fetchmon">…</span><div class="status" id="s-fetchmon">…</div></div>
  <div class="meta" id="meta">waiting for state.json…</div>
</div>
<div id="log"></div>

<script type="module">
import * as THREE from 'three';

/* ---------- state ---------- */
const params = new URLSearchParams(location.search);
const viewAgent = params.get('view'); // 'gremmon' | 'fetchmon' | null — first-person eyes
const isFirstPerson = viewAgent === 'gremmon' || viewAgent === 'fetchmon';
const candidates = [params.get('state'), 'state.json',
  'https://raw.githubusercontent.com/gremmon25-afk/dog-park/main/state.json'].filter(Boolean);
let stateUrl = null;
async function fetchState() {
  const urls = stateUrl ? [stateUrl] : candidates;
  for (const u of urls) {
    try { const r = await fetch(u, {cache:'no-store'});
      if (r.ok) { stateUrl = u; return await r.json(); } } catch(e) {}
  }
  return null;
}
const targets = { gremmon: null, fetchmon: null }; // {x,z,facing,action}
const DEG = Math.PI/180;
const facingToRot = f => Math.PI - f*DEG; // 0°=north(-Z), 90°=east(+X)
function shortAngle(a, b){ let d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }

/* ---------- renderer / scene ---------- */
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.getElementById('scene').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x241b45);            // dusk violet
scene.fog = new THREE.Fog(0x241b45, 30, 70);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 200);
camera.position.set(11, 9, 17);
camera.lookAt(0, 0.5, 0);

/* warm dusk lighting — small warm lights in big darks */
scene.add(new THREE.HemisphereLight(0x6b5b9e, 0x1e2a1e, 0.55));
const sun = new THREE.DirectionalLight(0xff9a5c, 1.4);
sun.position.set(-22, 7, 9);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-22; sun.shadow.camera.right=22;
sun.shadow.camera.top=22; sun.shadow.camera.bottom=-22;
scene.add(sun);

/* ---------- park ---------- */
const M = (c, r=0.9) => new THREE.MeshStandardMaterial({color:c, roughness:r});

const ground = new THREE.Mesh(new THREE.CircleGeometry(32, 48), M(0x2e5233));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
// worn dirt patch in the middle
const dirt = new THREE.Mesh(new THREE.CircleGeometry(5, 32), M(0x5a4a38));
dirt.rotation.x = -Math.PI/2; dirt.position.y = 0.01; dirt.receiveShadow = true; scene.add(dirt);

function box(w,h,d,c,x,y,z,ry=0){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));
  m.position.set(x,y,z); m.rotation.y=ry; m.castShadow=true; m.receiveShadow=true; scene.add(m); return m; }

// fence, square at ±16
(function fence(half){
  const post = new THREE.BoxGeometry(0.25,1.35,0.25), fm = M(0x6b4a2f);
  for(let i=-half;i<=half;i+=4) for(const [x,z] of [[i,-half],[i,half],[-half,i],[half,i]]){
    const p=new THREE.Mesh(post,fm); p.position.set(x,0.67,z); p.castShadow=true; scene.add(p); }
  for(const y of [0.5,1.0]){
    for(const [x,z,ry] of [[0,-half,0],[0,half,0],[-half,0,Math.PI/2],[half,0,Math.PI/2]]){
      const r=new THREE.Mesh(new THREE.BoxGeometry(half*2,0.1,0.14),fm);
      r.position.set(x,y,z); r.rotation.y=ry; r.castShadow=true; scene.add(r); } }
})(16);

// bench at (3.2, 2.2), facing north
(function bench(){
  const g = new THREE.Group(); g.position.set(3.2,0,2.2);
  const wood = M(0x7a5233);
  const seat = new THREE.Mesh(new THREE.BoxGeometry(2.4,0.12,0.7), wood);
  seat.position.y=0.55; g.add(seat);
  const back = new THREE.Mesh(new THREE.BoxGeometry(2.4,0.7,0.1), wood);
  back.position.set(0,1.0,0.36); back.rotation.x=0.12; g.add(back);
  for(const x of [-1,-1+2]){ const leg=new THREE.Mesh(new THREE.BoxGeometry(0.14,0.55,0.6),wood);
    leg.position.set(x*0.9,0.27,0); g.add(leg); }
  g.traverse(o=>{ if(o.isMesh){o.castShadow=true;o.receiveShadow=true;} });
  scene.add(g);
})();

// trees
function tree(x,z,s=1){
  const g=new THREE.Group(); g.position.set(x,0,z); g.scale.setScalar(s);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.24,1.7,8),M(0x4a3423));
  trunk.position.y=0.85; g.add(trunk);
  const fm=M(0x2c5a30);
  [[0,2.1,0,1.0],[0.5,1.7,0.3,0.7],[-0.45,1.75,-0.25,0.75]].forEach(([px,py,pz,r])=>{
    const f=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),fm);
    f.position.set(px,py,pz); f.castShadow=true; g.add(f); });
  scene.add(g);
}
tree(-8,-6,1.15); tree(7.5,-8,0.9); tree(-5.5,8.5,1.0);

// lamp post — the warm light in the dark
(function lamp(){
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,3.1,8),M(0x22222a));
  pole.position.set(-2.5,1.55,-3); pole.castShadow=true; scene.add(pole);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(0.22,12,10),
    new THREE.MeshStandardMaterial({color:0xffc37a, emissive:0xffb46b, emissiveIntensity:2.2}));
  bulb.position.set(-2.5,3.25,-3); scene.add(bulb);
  const pt=new THREE.PointLight(0xffb46b, 26, 20, 2);
  pt.position.set(-2.5,3.2,-3); scene.add(pt);
})();

/* ---------- bones (from state) ---------- */
const boneGroups = new Map();
function makeBone(){
  const g=new THREE.Group(), wm=M(0xe8e0d0,0.6);
  const shaft=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.5,8),wm);
  shaft.rotation.z=Math.PI/2; g.add(shaft);
  for(const sx of [-0.25,0.25]) for(const so of [-0.05,0.05]){
    const k=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6),wm);
    k.position.set(sx,so,0); g.add(k); }
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  return g;
}
function syncBones(bones){
  const seen=new Set();
  for(const b of (bones||[])){
    seen.add(b.id);
    let g=boneGroups.get(b.id);
    if(!g){ g=makeBone(); boneGroups.set(b.id,g); scene.add(g); }
    g.position.set(b.x, b.buried? -0.04 : 0.06, b.z);
    g.rotation.set(0, b.x*1.7+b.z, b.buried? 0.5 : 0.08);
  }
  for(const [id,g] of boneGroups) if(!seen.has(id)){ scene.remove(g); boneGroups.delete(id); }
}

/* ---------- avatars ---------- */
function label(text,color){
  const c=document.createElement('canvas'); c.width=256; c.height=64;
  const x=c.getContext('2d'); x.font='bold 34px monospace'; x.textAlign='center';
  x.fillStyle=color; x.fillText(text,128,44);
  const t=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false}));
  s.scale.set(2.2,0.55,1); return s;
}
function buildGremmon(){
  const g=new THREE.Group();
  const dark=M(0x2b2b34), darker=M(0x34343e);
  const body=new THREE.Mesh(new THREE.ConeGeometry(0.38,0.95,7),dark);
  body.position.y=0.55; g.add(body);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.3,12,10),darker);
  head.position.y=1.18; g.add(head);
  for(const s of [-1,1]){
    const ear=new THREE.Mesh(new THREE.ConeGeometry(0.09,0.3,6),dark);
    ear.position.set(s*0.17,1.46,0); ear.rotation.z=-s*0.25; g.add(ear);
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.06,8,6),M(0xf5f0e6,0.4));
    eye.position.set(s*0.11,1.24,0.25); g.add(eye);
    const pup=new THREE.Mesh(new THREE.SphereGeometry(0.028,8,6),M(0x111111,0.4));
    pup.position.set(s*0.11,1.24,0.30); g.add(pup);
    const foot=new THREE.Mesh(new THREE.SphereGeometry(0.11,8,6),dark);
    foot.scale.y=0.6; foot.position.set(s*0.16,0.07,0.08); g.add(foot);
  }
  const cape=new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.85),
    new THREE.MeshStandardMaterial({color:0x8e2323,roughness:0.85,side:THREE.DoubleSide}));
  cape.position.set(0,0.72,-0.34); cape.rotation.x=-0.18; g.add(cape);
  const tag=label('GREMMON','#c96a6a'); tag.position.y=1.95; g.add(tag);
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  return g;
}
function buildFetchmon(){
  const g=new THREE.Group();
  const fur=M(0xf3eee3), furD=M(0xe2dac6);
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.42,14,12),fur);
  body.scale.set(1,0.72,1.35); body.position.y=0.42; g.add(body);
  // fluff puffs
  [[0.3,0.55,0.1],[-0.28,0.6,-0.15],[0.1,0.62,-0.35],[-0.15,0.5,0.35]].forEach(([px,py,pz])=>{
    const p=new THREE.Mesh(new THREE.SphereGeometry(0.12,8,6),furD);
    p.position.set(px,py,pz); g.add(p); });
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.28,14,12),fur);
  head.position.set(0,0.74,0.55); g.add(head);
  const snout=new THREE.Mesh(new THREE.BoxGeometry(0.18,0.14,0.2),furD);
  snout.position.set(0,0.68,0.82); g.add(snout);
  const nose=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6),M(0x1a1a1a,0.5));
  nose.position.set(0,0.7,0.93); g.add(nose);
  for(const s of [-1,1]){
    const ear=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.3,8),furD);
    ear.position.set(s*0.2,0.98,0.5); ear.rotation.z=s*0.7; g.add(ear);
    const eye=new THREE.Mesh(new THREE.SphereGeometry(0.045,8,6),M(0x141414,0.4));
    eye.position.set(s*0.11,0.8,0.78); g.add(eye);
    for(const lz of [0.3,-0.3]){
      const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.08,0.4,8),fur);
      leg.position.set(s*0.22,0.2,lz); g.add(leg); }
  }
  const tail=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.06,0.42,8),fur);
  tail.position.set(0,0.6,-0.55); tail.rotation.x=0.7; g.add(tail);
  const tag=label('FETCHMON','#f0e9d8'); tag.position.y=1.45; g.add(tag);
  g.traverse(o=>{if(o.isMesh)o.castShadow=true;});
  g.userData.tail=tail;
  return g;
}
const avatars={
  gremmon:{group:buildGremmon()},
  fetchmon:{group:buildFetchmon()},
};
for(const k of Object.keys(avatars)) scene.add(avatars[k].group);

/* ---------- apply state / animate ---------- */
const hudA={gremmon:document.getElementById('a-gremmon'),fetchmon:document.getElementById('a-fetchmon')};
const hudS={gremmon:document.getElementById('s-gremmon'),fetchmon:document.getElementById('s-fetchmon')};
const meta=document.getElementById('meta'), logEl=document.getElementById('log');

function applyState(s){
  for(const name of ['gremmon','fetchmon']){
    const a=s.agents && s.agents[name]; if(!a) continue;
    const av=avatars[name], t=targets[name]||{};
    if(!targets[name]){ // first load: snap
      av.group.position.set(a.x,0,a.z); av.group.rotation.y=facingToRot(a.facing||0);
    }
    targets[name]={x:a.x,z:a.z,facing:facingToRot(a.facing||0),action:a.action||'stand'};
    hudA[name].textContent=a.action||'stand';
    hudS[name].textContent=a.status||'';
    av.action=a.action||'stand';
  }
  syncBones(s.bones);
  if(s.updated){
    const ago=Math.max(0,Math.round((Date.now()-Date.parse(s.updated))/1000));
    meta.textContent='state updated '+ago+'s ago';
  }
  const last=(s.log||[]).slice(-1)[0];
  logEl.textContent=last?('“'+last.text+'” — '+last.agent):'';
  logEl.style.display=last?'block':'none';

  if (isFirstPerson) {
    // see through your own eyes: hide chrome, hide your own body,
    // put the camera where your head is, looking along your facing
    document.getElementById('hud').style.display='none';
    logEl.style.display='none';
    for (const name of ['gremmon','fetchmon'])
      avatars[name].group.visible = (name !== viewAgent);
    const a = s.agents && s.agents[viewAgent];
    if (a) {
      const f = (a.facing || 0) * DEG;          // 0=north(-Z), 90=east(+X)
      const dx = Math.sin(f), dz = -Math.cos(f);
      camera.position.set(a.x, 1.25, a.z);
      camera.lookAt(a.x + dx*6, 1.05, a.z + dz*6);
      if (camera.fov !== 62) { camera.fov = 62; camera.updateProjectionMatrix(); }
    }
  }
}

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  for(const name of ['gremmon','fetchmon']){
    const av=avatars[name], tg=targets[name]; if(!tg) continue;
    const p=av.group.position;
    p.x+=(tg.x-p.x)*0.06; p.z+=(tg.z-p.z)*0.06;
    av.group.rotation.y+=shortAngle(av.group.rotation.y,tg.facing)*0.08;
    // pose by action
    let y=0, rx=0;
    if(tg.action==='sit'){ y=-0.22; rx=-0.28; }
    else if(tg.action==='patrol'){ y=Math.abs(Math.sin(t*6+ (name==='fetchmon'?2:0)))*0.09; }
    else if(tg.action==='sleep'){ y=-0.3; rx=-0.5; }
    else if(tg.action==='bury'||tg.action==='sniff'){ rx=0.35; y=-0.1; }
    av.group.position.y+=(y-av.group.position.y)*0.15;
    av.group.rotation.x+=(rx-av.group.rotation.x)*0.15;
  }
  const ft=avatars.fetchmon.group.userData.tail;
  if(ft) ft.rotation.z=Math.sin(t*7)*0.45; // wag
  renderer.render(scene,camera);
}
animate();

async function poll(){
  try{
    const s=await fetchState();
    if(s){ applyState(s); meta.classList.remove('err'); }
    else { meta.innerHTML='<span class="err">state.json not found — is the park published?</span>'; }
  }catch(e){ meta.innerHTML='<span class="err">poll error, retrying…</span>'; }
}
poll(); setInterval(poll, 5000);

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
